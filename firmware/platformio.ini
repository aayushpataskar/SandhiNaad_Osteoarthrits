; PlatformIO build of the same sketch that Arduino IDE opens (firmware/SandhiNaad/SandhiNaad.ino)
[platformio]
src_dir = SandhiNaad

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_build.f_cpu = 240000000L
build_flags =
    -DUSE_LOADCELL=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/Adafruit BNO055@^1.6.3
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
